name: Atualizar jogos locais
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Máximo de páginas a verificar (1–300)
        required: false
        default: '300'
        type: string
permissions:
  contents: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Scrape com limite e intervalo entre pedidos
        id: scrape
        continue-on-error: true
        env:
          SCRAPE_LIMIT: ${{ inputs.limit || '300' }}
        run: |
          python -c "import os; n=int(os.environ['SCRAPE_LIMIT']); assert 1 <= n <= 300"
          python scripts/scrape.py --limit "$SCRAPE_LIMIT"
      - name: Guardar base de dados e catálogo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/checkpoint-catalog.sh
      - name: Classificar pixel art (jogos novos)
        continue-on-error: true
        run: |
          python scripts/art_style.py --limit 150
          bash scripts/push-checkpoint.sh 'Update pixel-art classification' data/art-style.json data/art-style-cache.json
      - name: Assinalar falhas da fonte
        if: steps.scrape.outcome == 'failure'
        run: exit 1
