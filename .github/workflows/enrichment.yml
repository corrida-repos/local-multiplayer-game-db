name: Catch up all game enrichment
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Backfill complete catalogue coverage', 'Atualizar jogos locais']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: enrichment-update
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Configure checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Fill minimum data for every game, then finish all remaining stages
        run: python -u -m scripts.enrichment --minutes 50 --workers 4 --checkpoint-push
      - name: Save remaining results
        if: always()
        run: bash scripts/checkpoint-enrichment.sh
