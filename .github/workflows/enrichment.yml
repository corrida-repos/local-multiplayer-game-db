name: Catch up all game enrichment
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      game_ids:
        description: Optional comma-separated PS5/ Switch database keys for a targeted recovery
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ['Backfill complete catalogue coverage', 'Atualizar jogos locais']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: enrichment-update
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Load the latest catalog and collector after waiting in the queue
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Configure checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Record coverage before this run
        id: baseline
        run: cp data/enrichment.json "$RUNNER_TEMP/enrichment-before.json"
      - name: Fill minimum data for every game, then finish all remaining stages
        env:
          ENRICHMENT_IDS: ${{ inputs.game_ids || '' }}
        run: |
          enrichment_args=(--minutes 50 --workers 8 --checkpoint-push)
          if [ -n "$ENRICHMENT_IDS" ]; then
            enrichment_args+=(--ids "$ENRICHMENT_IDS")
          fi
          python -u -m scripts.enrichment "${enrichment_args[@]}"
      - name: Save remaining results
        if: always() && !cancelled()
        run: bash scripts/checkpoint-enrichment.sh
      - name: Report coverage gains, regressions and source failures
        if: always() && !cancelled() && steps.baseline.outcome == 'success'
        run: python -m scripts.enrichment_report --before "$RUNNER_TEMP/enrichment-before.json"
